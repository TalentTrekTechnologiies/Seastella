name: build

# Every push and every pull request. The traceability matrix says a requirement
# reaches VERIFIED only when its test passes in CI, so this is what that claim
# rests on: the suite runs here, on a clean checkout, with nothing from anyone's
# machine.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: backend — ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is what the pilot deploys on; 21 is the next LTS, run so an
        # upgrade is a decision rather than a surprise.
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build and test
        working-directory: backend
        run: mvn --batch-mode -Djava.version=${{ matrix.java }} verify

      # The reports are what a failure is diagnosed from; keep them whether or
      # not the run went green.
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java-${{ matrix.java }}
          path: |
            backend/*/target/surefire-reports/**
            backend/*/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Application jar
        if: matrix.java == '17' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: seastella-jar
          path: backend/app/target/seastella.jar
          retention-days: 14

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # Type errors fail the build here rather than at runtime in someone's
      # browser: `npm run build` runs tsc before Vite.
      - name: Type-check and build
        working-directory: frontend
        run: npm run build

      - name: Site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: seastella-site
          path: frontend/dist
          retention-days: 14
