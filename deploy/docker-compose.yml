# Thawe Marine on the VPS: PostgreSQL and the backend, both private to the
# machine. nginx is the only thing facing the internet; it serves the built
# frontend at https://thaweone.com/ and forwards
# /api/ to the backend on 127.0.0.1 (nginx-thawemarine.conf).
#
#   cp .env.example .env    # then fill it in
#   docker compose up -d --build
#
# See docs/09-deployment.md.
name: thawemarine

# Container logs rotate at 5 x 10 MB instead of growing until the disk fills.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: thawemarine
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d thawemarine"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ../backend
    restart: unless-stopped
    logging: *logging
    # The VPS is shared with other sites: cap the backend, and size the Java
    # heap from the cap (60% of 2 GB) rather than from the whole machine.
    mem_limit: 2g
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/thawemarine
      UPLOAD_DIR: /var/seastella/documents
      JAVA_OPTS: -XX:MaxRAMPercentage=60
    # Loopback only: reachable from nginx on this machine, not from outside.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      # Certificates, manuals and photos. The only copy: back it up (backup.sh).
      - uploads:/var/seastella/documents

volumes:
  db-data:
  uploads:
