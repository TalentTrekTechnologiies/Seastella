# Thawe Marine at https://thawemarine.seastella.in/
#
# The whole site config for the subdomain. On the VPS:
#   cp deploy/nginx-thawemarine.conf /etc/nginx/sites-available/thawemarine
#   ln -sf /etc/nginx/sites-available/thawemarine /etc/nginx/sites-enabled/thawemarine
#   nginx -t && systemctl reload nginx
#
# The certificate paths are the ones certbot created for this subdomain.
# HTTPS is required: the sign-in refresh cookie is Secure.

server {
    listen 80;
    listen [::]:80;
    server_name thawemarine.seastella.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name thawemarine.seastella.in;

    ssl_certificate     /etc/letsencrypt/live/thawemarine.seastella.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thawemarine.seastella.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The built frontend, copied here by deploy.sh.
    root /var/www/thawemarine;
    index index.html;

    # API: forwarded to the backend on this machine's loopback.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads go up to 25 MB (spring.servlet.multipart).
        client_max_body_size 30m;
        proxy_read_timeout 120s;
    }

    # The live activity stream (server-sent events): unbuffered and long-lived.
    location /api/v1/activity/stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # File names carry a content hash, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Unknown paths fall back to index.html so deep links (/requests/42) load.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
