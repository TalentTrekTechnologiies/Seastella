# Thawe Marine at https://thaweone.com/
#
# The whole site config for the site's own domain. On the VPS:
#   cp deploy/nginx-thawemarine.conf /etc/nginx/sites-available/thawemarine
#   ln -sf /etc/nginx/sites-available/thawemarine /etc/nginx/sites-enabled/thawemarine
#   nginx -t && systemctl reload nginx
#
# The certificate paths are the ones certbot created for this domain.
# HTTPS is required: the sign-in refresh cookie is Secure.

# Plain HTTP, either name: always to the canonical address - except the one
# path Let's Encrypt needs. It proves the domain over plain HTTP every 60 days
# when the certificate renews, and a redirect at server level would send that
# check to the app, which answers every unknown path with index.html. The first
# certificate would issue and the renewal would quietly fail two months later.
# The challenge files live outside the web root, so deploy.sh's rsync --delete
# never removes one mid-renewal.
server {
    listen 80;
    listen [::]:80;
    server_name thaweone.com www.thaweone.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://thaweone.com$request_uri;
    }
}

# www is answered so it does not fail, but it does not serve the app. One
# address for one session: the sign-in refresh cookie is bound to the host
# that set it, so a person who signed in on www and then followed a link to
# the bare domain would be signed out with no explanation.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.thaweone.com;

    ssl_certificate     /etc/letsencrypt/live/thaweone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thaweone.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://thaweone.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name thaweone.com;

    ssl_certificate     /etc/letsencrypt/live/thaweone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thaweone.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The built frontend, copied here by deploy.sh.
    root /var/www/thawemarine;
    index index.html;

    # Compression: the app's script is ~500 KB raw, ~145 KB compressed.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml application/xml;

    # Security headers, for every response. No location below sets its own
    # add_header, so all of them inherit these.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API: forwarded to the backend on this machine's loopback.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads go up to 25 MB (spring.servlet.multipart).
        client_max_body_size 30m;
        proxy_read_timeout 120s;
    }

    # The live activity stream (server-sent events): unbuffered and long-lived.
    location /api/v1/activity/stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # File names carry a content hash, so they can be cached for good.
    location /assets/ {
        expires max;
    }

    # Always revalidated, so a new deployment is picked up on the next load.
    location = /index.html {
        expires -1;
    }

    # Unknown paths fall back to index.html so deep links (/requests/42) load.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# The address the pilot started on. It is not served any more, but it is not
# dropped either: invitation and password-reset emails already sent link here,
# and this server is shared. A name with no site of its own falls through to
# whichever site nginx loaded first - on this machine that is another
# company's, with that company's certificate - so without these blocks an old
# link would open somebody else's website behind a security warning.
#
# The path and query string travel with the redirect, so a reset link that was
# valid on the old address is still valid on the new one. Keep these until the
# seastella.in record itself is removed; nginx -t fails if the certificate is
# deleted first.
server {
    listen 80;
    listen [::]:80;
    server_name thawemarine.seastella.in;

    # The old certificate renews too, for as long as these blocks are kept.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://thaweone.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name thawemarine.seastella.in;

    ssl_certificate     /etc/letsencrypt/live/thawemarine.seastella.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thawemarine.seastella.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://thaweone.com$request_uri;
}
