# Production: PostgreSQL. All credentials come from the environment.
spring:
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: false
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.starttls.enable: true

seastella:
  seed:
    enabled: false                # never seed demo data into production
  upload:
    storage-dir: ${UPLOAD_DIR:/var/seastella/documents}

logging:
  level:
    root: INFO
    com.seastella: INFO
